apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ------------------ ArgoCD Image Updater ------------------
    argocd-image-updater.argoproj.io/image-list: apache=docker.io/anusha292/apache-hello
    argocd-image-updater.argoproj.io/apache.update-strategy: semver
    argocd-image-updater.argoproj.io/apache.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: testing
    argocd-image-updater.argoproj.io/git-repo: https://github.com/Anusha-292/Argo-CD
    argocd-image-updater.argoproj.io/git-token: git-creds
    # ----------------------------------------------------------

spec:
  project: default

  source:
    repoURL: https://github.com/Anusha-292/Argo-CD
    targetRevision: testing
    path: charts/webapp              # <-- points to your Helm chart
    helm:
      releaseName: webapp
      valueFiles:
        - values.yaml

  destination:
    namespace: webapp
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
