apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-hello
  labels:
    app: apache-hello
  annotations:
    # Image list for ArgoCD Image Updater
    argocd-image-updater.argoproj.io/image-list: apache=docker.io/anusha292/apache-hello

    # Use pull secret for DockerHub authentication
    argocd-image-updater.argoproj.io/apache.pull-secret: pullsecret:docker-creds

    # Use tag-based versioning (semver pattern)
    argocd-image-updater.argoproj.io/apache.update-strategy: "semver"

    # Allow timestamp versioning even though it's not pure semver
    argocd-image-updater.argoproj.io/apache.allow-tags: "regexp:^v[0-9]{8}-[0-9]{6}$"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-hello
  template:
    metadata:
      labels:
        app: apache-hello
    spec:
      imagePullSecrets:
        - name: docker-creds
      containers:
        - name: apache
          image: docker.io/anusha292/apache-hello:v0.0.0
          ports:
            - containerPort: 80
