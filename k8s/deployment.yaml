apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-hello
  labels:
    app: apache-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-hello
  template:
    metadata:
      labels:
        app: apache-hello
    spec:
      imagePullSecrets:
        - name: docker-creds
      containers:
        - name: apache
          image: docker.io/anusha292/apache-hello:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
