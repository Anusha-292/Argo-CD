apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-hello
  labels:
    app: apache-hello
  annotations:
    # ArgoCD Image Updater watches this image
    argocd-image-updater.argoproj.io/image-list: apache=docker.io/anusha292/apache-hello

    # Tell it to use our pull secret
    argocd-image-updater.argoproj.io/apache.pull-secret: pullsecret:docker-creds

    # Strategy: always pick the newest digest / tag
    argocd-image-updater.argoproj.io/apache.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-hello
  template:
    metadata:
      labels:
        app: apache-hello
    spec:
      imagePullSecrets:
        - name: docker-creds
      containers:
        - name: apache
          image: docker.io/anusha292/apache-hello:sha-PLACEHOLDER
          ports:
            - containerPort: 80
