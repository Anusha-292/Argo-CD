apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-hello
  labels:
    app: apache-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-hello
  template:
    metadata:
      labels:
        app: apache-hello
      annotations:
        # Optional: for Argo CD Image Updater (if you install it)
        argocd-image-updater.argoproj.io/apache-hello.image-list: apache-hello=${DOCKERHUB_USERNAME}/apache-hello
    spec:
      containers:
        - name: apache
          image: ${DOCKERHUB_USERNAME}/apache-hello:latest
          ports:
            - containerPort: 80
