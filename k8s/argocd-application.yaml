apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-hello-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/<your-github-or-org>/<your-repo>.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
