name: Build and Push Docker Image

on:
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ------------------ CHECKOUT ------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: testing

      # ------------------ SEMVER VERSIONING ------------------
      - name: Determine next semantic version
        id: semver
        run: |
          if [ ! -f VERSION ]; then
            echo "v1.0.0" > VERSION
          fi

          old=$(cat VERSION)
          echo "Old version: $old"

          # Extract numbers
          major=$(echo $old | cut -d. -f1 | sed 's/v//')
          minor=$(echo $old | cut -d. -f2)
          patch=$(echo $old | cut -d. -f3)

          # Increment PATCH version (you can change to MAJOR/MINOR if needed)
          patch=$((patch + 1))
          new="v${major}.${minor}.${patch}"

          echo "New version: $new"
          echo "$new" > VERSION

          # Set output for later steps
          echo "version=$new" >> $GITHUB_OUTPUT

      # ------------------ UPDATE VALUES.YAML ------------------
      - name: Update image tag in values.yaml
        run: |
          new_tag=${{ steps.semver.outputs.version }}
          echo "Updating values.yaml with tag: $new_tag"
          sed -i "s|tag: .*|tag: $new_tag|" charts/webapp/values.yaml
          git add charts/webapp/values.yaml VERSION

      # ------------------ DOCKER LOGIN ------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------ BUILD & PUSH IMAGE ------------------
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            docker.io/anusha292/apache-hello:${{ steps.semver.outputs.version }}

      # ------------------ COMMIT CHANGES ------------------
      - name: Commit updated VERSION and values.yaml
        run: |
          git config --global user.name "Anusha-292"
          git config --global user.email "anushareddy29200@gmail.com"
          git commit -m "Bump version to ${{ steps.semver.outputs.version }}" || echo "No changes to commit"

      - name: Push updated files to testing branch
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: testing
